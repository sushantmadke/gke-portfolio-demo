# Bootstrap note: the very first `terraform apply` (which creates the cluster, IAM
# service accounts, and the Workload Identity Federation pool itself) must be run
# locally by a human with project-level IAM Admin rights - a CI identity can't grant
# itself the permissions to create itself. This workflow is for *ongoing* plan/apply
# once that bootstrap has happened and orderflow-ci-deployer has been granted enough
# infra-level roles (or a separate, more-privileged infra-ci SA is used instead).
name: Terraform

on:
  pull_request:
    paths: ["infra/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (otherwise plan-only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_DEPLOYER_SA_EMAIL }}

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - name: terraform plan
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_repo=${{ github.repository }}" \
            -out=tfplan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: terraform apply -auto-approve tfplan
