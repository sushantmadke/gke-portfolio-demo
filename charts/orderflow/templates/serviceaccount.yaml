apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Workload Identity binding: pods running as this KSA authenticate to GCP APIs
    # (Pub/Sub) as the bound GSA below, with no mounted key file.
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
